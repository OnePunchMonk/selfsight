[project]
name = "selfsight"
version = "0.0.1"
description = "Self-improving post-training and evaluation for vision-language models"
requires-python = ">=3.10"
dependencies = [
    "vlm-evaluation-harness @ git+https://github.com/OnePunchMonk/vlm-evaluation-harness",
]

[project.optional-dependencies]
dev = ["pytest"]
training = [
    "torch",
    "transformers>=4.46,<5",
    "accelerate",
    "peft",
    "pyyaml",
]
modal = ["modal"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data", "training", "eval", "configs"]

[tool.hatch.metadata]
allow-direct-references = true
